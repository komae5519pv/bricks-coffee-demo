bundle:
  name: daiwt-coffee-shop

variables:
  agents_serving_endpoint_name:
    description: Default LLM serving endpoint name
  embedding_endpoint_name:
    description: Foundation Model API embedding endpoint for semantic menu search
  postgres_branch:
    description: Full Lakebase Postgres branch resource name
  postgres_database:
    description: Full Lakebase Postgres database resource name
  postgres_project:
    description: Full Lakebase Postgres project resource name

resources:
  apps:
    app:
      name: "daiwt-coffee-shop"
      description: "DAIWT Tokyo keynote coffee shop - 2026 rebuild: Lakebase-native, OBO, on-app agent"
      source_code_path: ./

      lifecycle:
        started: true

      # On-behalf-of: the app gets a per-user token for Lakebase (per-user
      # pg pools + RLS do the authorization).
      user_api_scopes:
        - postgres

      resources:
        - name: agents-serving-endpoint
          serving_endpoint:
            name: ${var.agents_serving_endpoint_name}
            permission: CAN_QUERY
        - name: embedding-endpoint
          serving_endpoint:
            name: ${var.embedding_endpoint_name}
            permission: CAN_QUERY
        - name: postgres
          postgres:
            branch: ${var.postgres_branch}
            database: ${var.postgres_database}
            permission: CAN_CONNECT_AND_CREATE

targets:
  default:
    default: true
    workspace:
      host: https://fevm-konomi-demo.cloud.databricks.com
      root_path: /Workspace/Users/konomi.omae@databricks.com/02_demo/apps/20260924_daiwt_tokyo_keynote

    variables:
      agents_serving_endpoint_name: databricks-claude-sonnet-4-5
      embedding_endpoint_name: databricks-qwen3-embedding-0-6b
      postgres_branch: projects/konomi-coffee-shop/branches/production
      postgres_database: projects/konomi-coffee-shop/branches/production/databases/databricks-postgres
      postgres_project: projects/konomi-coffee-shop

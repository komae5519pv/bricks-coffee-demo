# =============================================================================
# daiwt-coffee-shop — 環境パラメータの単一ソース (single source of truth)
#
# カタログ/スキーマ/Lakebase/LLM/埋め込み/warehouse/Genie スペース ID はすべて
# ここの variables に集約する。アプリ実行時に必要な値は tools/render_app_yaml.mjs
# がこのファイルから app.yaml を再生成して注入する (app.yaml を直接編集しない)。
#
# 再現デプロイ (別エンジニアが自分のワークスペースに作る場合) は README の
# 「再現デプロイ (DABs)」を参照。必須変数は catalog と warehouse_id の2つだけで、
# dev ターゲットの variables: に書くか `--var "catalog=..."` で渡す。
# ワークスペースの host/profile はここには書かず、実行時に `--profile <PROFILE>`
# で渡すこと (自分の CLI プロファイルが使われる)。
#
#   npm run render:appyaml                      # app.yaml 再生成
#   databricks bundle validate --profile <PROFILE> --var "catalog=<C>" --var "warehouse_id=<W>"
#   databricks bundle deploy   --profile <PROFILE>
#   databricks apps deploy     --profile <PROFILE>   # 引数なしで実行 (ソースを上げる)
#   scripts/post_deploy.sh     --profile <PROFILE>
# =============================================================================
bundle:
  name: daiwt-coffee-shop

include:
  - resources/*.yml

variables:
  # --- 必須 (デフォルトなし。dev ターゲットか --var で設定) ---
  catalog:
    description: CDC 履歴テーブルの複製先 & Genie のデータソースになる既存 UC カタログ (CREATE SCHEMA 権限が必要)
  warehouse_id:
    description: Delta 側のステータスクエリと Genie スペースが使う SQL warehouse の ID
  # --- Unity Catalog (Delta 側: Lakehouse Sync の複製先 & Genie のデータソース) ---
  schema:
    description: 'コーヒーショップの Delta オブジェクト用 UC スキーマ名 ("cofee_shop" は意図的なスペル)'
    default: cofee_shop
  genie_space_id:
    description: Genie スペース ID。bundle deploy でスペース作成後に scripts/post_deploy.sh が自動記入する (手動作成時は README 初回セットアップ参照)
    default: ''
  # --- Lakebase (OLTP 側) ---
  lakebase_project_id:
    description: Lakebase プロジェクト ID (ワークスペース内でユニーク。小文字・数字・ハイフン)
    default: coffee-shop
  lakebase_branch_id:
    description: Lakebase デフォルトブランチの ID (プロジェクト作成時にこの名前で自動作成される)
    default: production
  postgres_project:
    description: Lakebase Postgres プロジェクトのフルリソース名
    default: projects/${var.lakebase_project_id}
  postgres_branch:
    description: Lakebase Postgres ブランチのフルリソース名
    default: ${var.postgres_project}/branches/${var.lakebase_branch_id}
  postgres_database:
    description: Lakebase Postgres データベースのフルリソース名 (databricks-postgres はプロジェクト作成時に自動作成される)
    default: ${var.postgres_branch}/databases/databricks-postgres
  cdf_config_id:
    description: Lakehouse Sync (CDC) 設定の ID。post_deploy.sh が REST/CLI で作成する (DABs 非対応のため)
    default: coffee_shop_cdc
  # --- アプリ / Genie ---
  app_name:
    description: Databricks Apps のアプリ名 (URL の一部になる。同一 WS に同居させる場合は変える)
    default: daiwt-coffee-shop
  genie_space_title:
    description: Genie スペースの表示名 (post_deploy.sh が ID 検索に使う)
    default: BRICKS COFFEE (Lakebase CDC デモ)
  demo_user_email:
    description: Genie の指示文で「私」として扱うデモユーザーのメールアドレス
    default: ${workspace.current_user.userName}
  secret_scope:
    description: シークレットスコープ名 (Unsplash キー等の格納用。値の投入は post_deploy.sh / 手動)
    default: daiwt-coffee-shop
  # --- モデル ---
  agents_serving_endpoint_name:
    description: バリスタエージェントが使う LLM サービングエンドポイント名
    default: databricks-claude-sonnet-4-5
  embedding_endpoint_name:
    description: メニューのセマンティック検索に使う Foundation Model API 埋め込みエンドポイント
    default: databricks-qwen3-embedding-0-6b

targets:
  # デフォルトターゲット。ワークスペースは --profile で渡す (ここに host を書かない)。
  # 必須変数はここで上書きする:
  #   targets:
  #     dev:
  #       variables:
  #         catalog: my_catalog
  #         warehouse_id: abc123def456
  dev:
    default: true
    variables: {}
  # ---------------------------------------------------------------------------
  # 別ターゲットの追加例 (Lakebase ブランチや UC スキーマを変えて同居させる):
  #   staging:
  #     variables:
  #       catalog: my_catalog
  #       warehouse_id: abc123def456
  #       schema: cofee_shop_staging
  #       lakebase_project_id: coffee-shop-staging
  #       app_name: daiwt-coffee-shop-staging
  # ---------------------------------------------------------------------------

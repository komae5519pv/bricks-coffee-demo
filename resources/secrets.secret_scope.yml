# シークレットスコープ (スコープの器のみ。値は bundle に書けないため
# scripts/post_deploy.sh が対話で投入するか `databricks secrets put-secret` で手動投入)。
# 現状のアプリ本体はシークレット不要 (OBO + SP 認証のため)。Unsplash API キー
# (tools/fetch_unsplash_images.mjs で商品画像を再取得する場合のみ必要) の保管場所。
resources:
  secret_scopes:
    app_secrets:
      name: ${var.secret_scope}
